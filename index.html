<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A+ Visual Study Guide Generator</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: #0d1322;
            --text-color: #f1f5f9;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #1e293b;
            --input-bg: #020617;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 { font-size: 2rem; margin: 0; color: #60a5fa; letter-spacing: -0.5px; }
        .watermark { font-size: 0.85rem; color: #64748b; font-weight: 500; }
        
        .section-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #94a3b8; }
        
        input[type="password"], textarea {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        input[type="password"]:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            outline: none;
        }
        textarea { height: 140px; resize: vertical; }
        
        .counter { font-size: 0.75rem; color: #64748b; text-align: right; margin-top: 6px; }

        .accordion-wrapper {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .accordion-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(13, 19, 34, 0.5);
        }
        .accordion-header:hover { background: rgba(30, 41, 59, 0.5); color: #fff; }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            padding: 0 18px;
        }
        .accordion-content.open {
            max-height: 480px;
            padding: 16px 18px 18px 18px;
            overflow-y: auto;
        }
        
        .option-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        @media(max-width: 900px) { .option-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(max-width: 600px) { .option-grid { grid-template-columns: 1fr; } }
        
        .option-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-card:hover { border-color: #475569; }
        .option-card.active {
            background: rgba(59, 130, 246, 0.12);
            border-color: var(--accent-color);
            color: #60a5fa;
        }
        .card-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 2px; }
        .card-desc { font-size: 0.7rem; color: #64748b; line-height: 1.2; }

        button.generate-btn {
            margin-top: 15px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: background 0.2s;
        }
        button.generate-btn:hover { background: var(--accent-hover); }

        .output-section {
            margin-top: 35px;
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
        }
        
        .output-box {
            background: #ffffff;
            color: #1e293b;
            padding: 40px;
            border-radius: 10px;
            min-height: 350px;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        
        .output-box h2 { color: #1e40af; border-bottom: 2px solid #3b82f6; padding-bottom: 6px; margin-top: 30px; font-size: 1.3rem; }
        .output-box .cheat-card {
            background: #f8fafc;
            border-left: 4px solid #3b82f6;
            padding: 10px 14px;
            margin: 10px 0;
            border-radius: 0 8px 8px 0;
        }
        .output-box .highlight-term { font-weight: bold; color: #0f172a; }
        
        .api-box { background: rgba(13, 19, 34, 0.7); padding: 16px; border-radius: 10px; margin-bottom: 25px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>A+ Visual Study Guide Generator</h1>
        <span class="watermark">Ultimate Cheat Sheet Mode</span>
    </header>

    <div class="api-box">
        <label for="apiKey">Gemini API Key (Saved securely in local storage)</label>
        <input type="password" id="apiKey" placeholder="Paste your AIzaSy... key here" oninput="saveApiKey()">
        <div class="counter" style="text-align: left; margin-top: 4px;">Characters: <span id="keyCounter">0</span></div>
    </div>

    <div class="section-group">
        <label>1. Select Document Source</label>
        <div class="accordion-wrapper">
            <div class="accordion-header" onclick="toggleAccordion('sourceContent', 'sourceArrow')">
                <span id="selectedSourceLabel">📖 Textbook Chapter / Reading Block</span>
                <span id="sourceArrow">▼</span>
            </div>
            <div class="accordion-content" id="sourceContent">
                <div class="option-grid">
                    <div class="option-card active" onclick="selectSource('Textbook Chapter', event)"><div class="card-title">📖 Textbook Chapter</div></div>
                    <div class="option-card" onclick="selectSource('Literature / Novel', event)"><div class="card-title">📚 Novel / Literature</div></div>
                    <div class="option-card" onclick="selectSource('Historical Document', event)"><div class="card-title">📜 Historical Doc</div></div>
                    <div class="option-card" onclick="selectSource('News Article / Editorial', event)"><div class="card-title">📰 News / Article</div></div>
                    <div class="option-card" onclick="selectSource('Lecture / Slides', event)"><div class="card-title">🎙️ Lecture / Slides</div></div>
                    <div class="option-card" onclick="selectSource('Worksheet Packet', event)"><div class="card-title">📄 Worksheet Packet</div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="section-group">
        <label for="rawText">Paste Messy Reading Material Here</label>
        <textarea id="rawText" placeholder="Paste your massive, confusing textbook chapters here..."></textarea>
        <div id="rawCounter" class="counter">Characters: 0</div>
    </div>

    <div class="section-group">
        <label for="teacherPrompt">Teacher Instructions / Test Focus (Optional)</label>
        <textarea id="teacherPrompt" style="height: 65px;" placeholder="e.g., 'Test will focus on definitions and key concepts...'"></textarea>
    </div>

    <button class="generate-btn" onclick="formatNotes()">Generate A+ Ultimate Cheat Sheet</button>

    <div class="output-section">
        <label>Print-Ready Format (Copy and Paste straight into Google Docs)</label>
        <div id="outputDisplay" class="output-box" contenteditable="true">Your ultra-simple, test-ready cheat sheet will appear here...</div>
    </div>
</div>

<script>
    let activeSource = 'Textbook Chapter';

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key') || '';
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            document.getElementById('keyCounter').innerText = savedKey.length;
        }
    });

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('keyCounter').innerText = key.length;
    }

    function toggleAccordion(contentId, arrowId) {
        const content = document.getElementById(contentId);
        const arrow = document.getElementById(arrowId);
        content.classList.toggle('open');
        arrow.innerText = content.classList.contains('open' ) ? '▲' : '▼';
    }

    function selectSource(label, event) {
        activeSource = label;
        document.getElementById('selectedSourceLabel').innerText = label;
        event.currentTarget.parentElement.querySelectorAll('.option-card').forEach(opt => opt.classList.remove('active'));
        event.currentTarget.classList.add('active');
        toggleAccordion('sourceContent', 'sourceArrow');
    }

    document.getElementById('rawText').addEventListener('input', (e) => {
        document.getElementById('rawCounter').innerText = `Characters: ${e.target.value.length}`;
    });

    async function formatNotes() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('rawText').value.trim();
        const prompt = document.getElementById('teacherPrompt').value.trim();
        const output = document.getElementById('outputDisplay');

        if (!apiKey) { output.innerHTML = "<p style='color:red;'>Error: Please add your API key.</p>"; return; }
        if (!text) { output.innerHTML = "<p style='color:red;'>Error: Please paste your reading text.</p>"; return; }

        output.innerHTML = "<p style='text-align:center; color:#3b82f6; font-weight:bold;'>✨ Stripping jargon and building your cheat sheet...</p>";

        const systemInstruction = `You are an elite academic engine that translates complex, confusing textbooks into ultra-simple, dead-clear cheat sheets designed to score an A+.

CRITICAL RULES:
1. NO JARGON / PLAIN ENGLISH ONLY: Explain everything like you are talking to a smart friend using everyday language. If the text uses a massive corporate or academic word, translate it instantly into what it actually means in real life.
2. STRICTLY NO EM DASHES: You are banned from using em dashes (\`—\`), en dashes (\`–\`), or semicolons. Use basic periods, commas, or normal sentence breaks.
3. VISUAL CARD STRUCTURE: Group the facts into visual HTML blocks using this exact template structure:
<h2>Topic Header Name</h2>
<div class="cheat-card">
  <span class="highlight-term">Bold Concept Term:</span> Direct, plain-English answer or definition explaining exactly how this works for the test.
</div>
4. ZERO MARKDOWN WRAPPERS: Do not use backticks (\`\`\`html). Output raw HTML elements directly so it drops cleanly into the visual box.`;

        let userQuery = `Create an ultimate cheat sheet from this material.\nSource Type: ${activeSource}\n`;
        if(prompt) userQuery += `Teacher Focus: ${prompt}\n`;
        userQuery += `\nSource Material:\n${text}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userQuery }] }],
                    system_instruction: { parts: [{ text: systemInstruction }] }
                })
            });

            const data = await response.json();
            if (data.error) {
                output.innerHTML = `<p style='color:red;'>API Error: ${data.error.message}</p>`;
                return;
            }

            let rawOutput = data.candidates[0].content.parts[0].text;
            rawOutput = rawOutput.replace(/```[a-z]*\n?/g, '').replace(/```/g, '');

            output.innerHTML = rawOutput;

        } catch (error) {
            output.innerHTML = "<p style='color:red;'>Network error occurred. Try again.</p>";
        }
    }
</script>

</body>
</html>
