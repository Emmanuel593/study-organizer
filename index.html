<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A+ Binder Study Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0b0f19; color: #f8fafc; padding: 25px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #111827; padding: 35px; border-radius: 16px; border: 1px solid #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box; }
        h1 { color: #60a5fa; margin-top: 0; font-size: 1.6rem; letter-spacing: -0.025em; }
        label { display: block; margin: 16px 0 6px; color: #9ca3af; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        textarea { width: 100%; padding: 14px; background: #030712; color: white; border: 1px solid #1f2937; border-radius: 10px; box-sizing: border-box; font-size: 0.95rem; transition: border-color 0.2s; }
        textarea:focus { outline: none; border-color: #3b82f6; }
        
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; color: #e5e7eb; font-weight: normal; margin-top: 18px; background: #030712; padding: 14px 18px; border-radius: 10px; border: 1px solid #1f2937; }
        .checkbox-label input { width: auto; margin: 0; cursor: pointer; transform: scale(1.1); }

        button { width: 100%; padding: 16px; background: #2563eb; color: white; border: none; border-radius: 10px; margin-top: 20px; cursor: pointer; font-weight: 600; font-size: 1.05rem; transition: background 0.2s, transform 0.1s; }
        button:hover { background: #1d4ed8; }
        button:active { transform: scale(0.99); }
        
        .btn-row { display: flex; gap: 12px; margin-top: 15px; }
        .copy-btn { background: #059669; flex: 1; padding: 15px; font-weight: 600; border-radius: 10px; border: none; color: white; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        .copy-btn:hover { background: #047857; }

        /* Output Area specifically mapped to pure Google Docs-safe plain formatting block */
        #output { background: #ffffff; color: #111827; padding: 45px; border-radius: 12px; margin-top: 30px; line-height: 1.7; min-height: 150px; border: 1px solid #e5e7eb; box-sizing: border-box; user-select: text; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        .doc-title { font-size: 22px; font-weight: bold; color: #000000; margin-bottom: 20px; margin-top: 0; text-transform: uppercase; }
        .cheat-card { background: #ffffff; color: #111827; margin-bottom: 25px; border-bottom: 1px solid #e5e7eb; padding-bottom: 15px; }
        .cheat-card h3 { margin-top: 0; margin-bottom: 8px; color: #000000; font-size: 16px; font-weight: bold; }
        .cheat-card p, .cheat-card ul { margin-top: 0; color: #222222; font-size: 1rem; }
        .cheat-card li { margin-bottom: 6px; }
        
        .quiz-card { background: #ffffff; color: #111827; margin-bottom: 25px; }
        .quiz-card h3 { margin-top: 0; margin-bottom: 15px; color: #000000; font-size: 16px; font-weight: bold; border-top: 2px solid #000000; padding-top: 15px; }
        .quiz-item { margin-bottom: 16px; background: #fafafa; padding: 12px; border-radius: 4px; border: 1px solid #e5e7eb; }
        .quiz-question { font-weight: bold; color: #000000; margin-bottom: 6px; }
        .quiz-answer { color: #047857; background: #f0fdf4; padding: 8px; border-radius: 4px; font-weight: 600; margin-top: 6px; display: block !important; }
    </style>
</head>
<body>
<div class="container">
    <h1>A+ Binder Study Generator</h1>
    
    <label>API Key</label>
    <textarea id="apiKey" rows="1" placeholder="Paste your API Key here..."></textarea>

    <label class="checkbox-label">
        <input type="checkbox" id="includeQuiz" checked> Include Practice Quiz & Test Answers (For Binder Reference)
    </label>

    <label>Source Text / Article / Assignment Transcript</label>
    <textarea id="rawText" rows="7" placeholder="Paste assignment text or reading material here..."></textarea>

    <button onclick="generate()">Generate Study Guide</button>
    
    <div class="btn-row">
        <button class="copy-btn" onclick="copyForGoogleDocs()">Copy Clean Text for Google Docs</button>
    </div>

    <div id="output">Generated binder material will appear here...</div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    });

    async function generate() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('rawText').value.trim();
        const includeQuiz = document.getElementById('includeQuiz').checked;
        const output = document.getElementById('output');

        if (!apiKey || !text) { 
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Missing API Key or Source Text</span>"; 
            return; 
        }

        localStorage.setItem('gemini_api_key', apiKey);
        output.innerHTML = "Generating top-tier binder material... Please wait.";

        const prompt = `Act as an expert academic tutor helping a student secure an A+ grade on open-note tests. 

        CRITICAL INSTRUCTIONS:
        1. Parse the provided source text completely. Begin directly with a clear main document title wrapped inside: <h2 class="doc-title">Your Descriptive Title Here</h2>
        2. ABSOLUTE BAN: NEVER use m-dashes (—), en-dashes, or double hyphens anywhere in the response under any circumstances. Use commas, colons, semicolons, periods, or parentheses instead.
        3. Structure core notes into clean vertical blocks using the "cheat-card" class. Each block must feature a clear, bold heading followed by clean explanatory text or standard bullet lists. 
        4. Include a concise "Executive Summary" section block at the end of the notes.
        5. ${includeQuiz ? 'Include a Practice Quiz and Test Review section wrapped inside an HTML element with class "quiz-card". Every single practice question MUST have its direct answer fully visible and printed right beneath it using this exact structure:\n           <div class="quiz-item">\n               <div class="quiz-question">Question text here?</div>\n               <div class="quiz-answer">Answer: Detailed explanation text goes here.</div>\n           </div>' : 'Do not include a practice quiz section.'}
        6. Do not wrap the response in markdown code blocks like \`\`\`html. Output raw styled HTML directly.

        Source Material: ${text}`;

        const models = ['gemini-3.5-flash-lite', 'gemini-2.5-flash-lite', 'gemini-3.5-flash'];
        let success = false;
        let data = null;

        for (let model of models) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{text: prompt}] }]
                    })
                });

                data = await response.json();
                if (!data.error) {
                    success = true;
                    break;
                }
            } catch (e) {
                // Proceed to next fallback model
            }
        }

        if (!success || !data || data.error) {
            const errorMsg = data && data.error ? data.error.message : "All endpoints are currently busy.";
            output.innerHTML = `<span style='color: #ef4444; font-weight: bold;'>API Error: ${errorMsg}</span>`;
            return;
        }

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            let rawHtml = data.candidates[0].content.parts[0].text;
            rawHtml = rawHtml.replace(/^```(html)?[\s\S]*?\n/, '').replace(/```$/, '').trim();
            rawHtml = rawHtml.replace(/—|–|--/g, ', ');
            output.innerHTML = rawHtml;
        } else {
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Unexpected response structure from API.</span>";
        }
    }

    async function copyForGoogleDocs() {
        const outputElement = document.getElementById('output');
        if (!outputElement || outputElement.innerText.includes("Generated binder material will appear here...")) {
            alert("Nothing to copy yet! Generate your notes first.");
            return;
        }

        try {
            // Forces clean plain text copying mapped seamlessly to how Google Docs interprets clipboard flow without layout distortion
            const textContent = outputElement.innerText;
            await navigator.clipboard.writeText(textContent);
            alert("Copied clean text directly to clipboard! Open your Google Doc and press Ctrl+V (or Cmd+V) to paste.");
        } catch (err) {
            alert("Clipboard permission error. Please manually highlight and copy the text box.");
        }
    }
</script>
</body>
</html>
