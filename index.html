<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A+ Binder Study Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0b0f19; color: #f8fafc; padding: 25px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #111827; padding: 35px; border-radius: 16px; border: 1px solid #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box; }
        h1 { color: #60a5fa; margin-top: 0; font-size: 1.6rem; letter-spacing: -0.025em; }
        label { display: block; margin: 16px 0 6px; color: #9ca3af; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        input, textarea, select { width: 100%; padding: 14px; background: #030712; color: white; border: 1px solid #1f2937; border-radius: 10px; box-sizing: border-box; font-size: 0.95rem; transition: border-color 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #3b82f6; }
        
        .char-count { font-size: 0.75rem; color: #6b7280; text-align: right; margin-top: 4px; font-weight: 500; }

        .checkbox-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; color: #e5e7eb; font-weight: normal; background: #030712; padding: 14px 18px; border-radius: 10px; border: 1px solid #1f2937; margin: 0; }
        .checkbox-label input { width: auto; margin: 0; cursor: pointer; transform: scale(1.1); }

        .grid-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 5px; }

        button { width: 100%; padding: 16px; background: #2563eb; color: white; border: none; border-radius: 10px; margin-top: 20px; cursor: pointer; font-weight: 600; font-size: 1.05rem; transition: background 0.2s, transform 0.1s; }
        button:hover { background: #1d4ed8; }
        button:active { transform: scale(0.99); }
        button:disabled { background: #4b5563; cursor: not-allowed; }

        .btn-export { background: #059669; margin-top: 10px; }
        .btn-export:hover { background: #047857; }

        /* Output card remains strictly white while outer app background stays dark */
        #output { background: #ffffff; color: #111827; padding: 45px; border-radius: 12px; margin-top: 30px; line-height: 1.7; min-height: 150px; border: 1px solid #e5e7eb; box-sizing: border-box; user-select: text; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        .doc-title { font-size: 22px; font-weight: bold; color: #000000; margin-bottom: 20px; margin-top: 0; text-transform: uppercase; }
        .cheat-card { background: #ffffff; color: #111827; margin-bottom: 25px; border-bottom: 1px solid #e5e7eb; padding-bottom: 15px; page-break-inside: avoid; }
        .cheat-card h3 { margin-top: 0; margin-bottom: 8px; color: #000000; font-size: 16px; font-weight: bold; }
        .cheat-card p, .cheat-card ul { margin-top: 0; color: #222222; font-size: 1rem; }
        .cheat-card li { margin-bottom: 6px; }
        
        .quiz-card { background: #ffffff; color: #111827; margin-bottom: 25px; page-break-inside: avoid; }
        .quiz-card h3 { margin-top: 0; margin-bottom: 15px; color: #000000; font-size: 16px; font-weight: bold; border-top: 2px solid #000000; padding-top: 15px; }
        .quiz-item { margin-bottom: 16px; background: #fafafa; padding: 12px; border-radius: 4px; border: 1px solid #e5e7eb; }
        .quiz-question { font-weight: bold; color: #000000; margin-bottom: 6px; }
        .quiz-answer { color: #047857; background: #f0fdf4; padding: 8px; border-radius: 4px; font-weight: 600; margin-top: 6px; display: block !important; }

        .glossary-card { background: #ffffff; color: #111827; margin-bottom: 25px; border-top: 2px solid #2563eb; padding-top: 15px; page-break-inside: avoid; }
        .glossary-card h3 { margin-top: 0; margin-bottom: 15px; color: #1d4ed8; font-size: 16px; font-weight: bold; }
        .glossary-item { margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 4px; border: 1px solid #e2e8f0; }
        .glossary-term { font-weight: bold; color: #1e293b; }

        .focus-card { background: #fffbeb; color: #92400e; padding: 12px 16px; border-radius: 8px; border-left: 4px solid #f59e0b; margin-bottom: 25px; font-weight: 500; page-break-inside: avoid; }

        /* Print styles: hides UI controls and formats output for clean paper or Save-as-PDF */
        @media print {
            body { background: white; color: black; padding: 0; }
            .container { background: white; border: none; box-shadow: none; padding: 0; max-width: 100%; }
            h1, label, .grid-controls, .checkbox-container, textarea, .char-count, #genBtn, #printBtn { display: none !important; }
            #output { border: none; box-shadow: none; padding: 0; margin: 0; color: black; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>A+ Binder Study Generator</h1>
    
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="Enter API Key">

    <div class="grid-controls">
        <div>
            <label>Detail Level</label>
            <select id="detailLevel">
                <option value="balanced">Balanced (Recommended)</option>
                <option value="simple">Simple & Concise</option>
                <option value="deep">Deep Dive / Comprehensive</option>
            </select>
        </div>
        <div>
            <label>Glossary Inclusion</label>
            <select id="includeGlossary">
                <option value="yes" selected>Include Key Terms Glossary</option>
                <option value="no">Skip Glossary</option>
            </select>
        </div>
    </div>

    <label>Teacher Focus / Special Instructions (Optional)</label>
    <textarea id="teacherFocus" rows="2" placeholder="e.g., Focus heavily on thematic shifts or specific historical figures mentioned by teacher..."></textarea>

    <div class="checkbox-container">
        <label class="checkbox-label">
            <input type="checkbox" id="includeQuiz" checked> practice quiz
        </label>
    </div>

    <label>Source Text / Article / Assignment Transcript</label>
    <textarea id="rawText" rows="6" placeholder="Paste literature/history assignment text or reading material here..." oninput="updateCharCount()"></textarea>
    <div class="char-count" id="charCount">0 characters</div>

    <button id="genBtn" onclick="generate()">Generate Study Guide</button>
    <button id="printBtn" class="btn-export" onclick="exportToPDF()">Export / Print Study Guide</button>

    <div id="output">Generated binder material will appear here... Highlight and copy this box directly into your Google Doc.</div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    });

    function updateCharCount() {
        const text = document.getElementById('rawText').value;
        document.getElementById('charCount').innerText = `${text.length} characters`;
    }

    async function generate() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('rawText').value.trim();
        const includeQuiz = document.getElementById('includeQuiz').checked;
        const detailLevel = document.getElementById('detailLevel').value;
        const includeGlossary = document.getElementById('includeGlossary').value === 'yes';
        const teacherFocus = document.getElementById('teacherFocus').value.trim();
        const output = document.getElementById('output');
        const genBtn = document.getElementById('genBtn');

        if (!apiKey || !text) { 
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Missing API Key or Source Text</span>"; 
            return; 
        }

        localStorage.setItem('gemini_api_key', apiKey);
        output.innerHTML = "Generating top-tier binder material... Please wait.";
        genBtn.disabled = true;

        const prompt = `Act as an expert academic tutor specializing in history, literature, and word-based humanities to help a student secure an A+ grade on open-note tests. 
        Depth Level: ${detailLevel}.
        ${teacherFocus ? `Special Teacher Focus Instructions to Prioritize: ${teacherFocus}` : ''}

        CRITICAL INSTRUCTIONS:
        1. Parse the provided source text completely. Begin directly with a clear main document title wrapped inside: <h2 class="doc-title">Your Descriptive Title Here</h2>
        2. ${teacherFocus ? `Include a distinct highlighted callout block right under the title summarizing the teacher's focus instructions using class "focus-card".` : ''}
        3. ABSOLUTE BAN: NEVER use m-dashes (—), en-dashes, or double hyphens anywhere in the response under any circumstances. Use commas, colons, semicolons, periods, or parentheses instead.
        4. Structure core notes into clean vertical blocks using the "cheat-card" class. Each block must feature a clear, bold heading followed by clean explanatory text or standard bullet lists. Emphasize historical significance, thematic context, character motivations, and cause-and-effect chains.
        5. Include a concise "Executive Summary" section block at the end of the notes.
        6. ${includeGlossary ? 'Include a Key Terms Glossary section wrapped inside an HTML element with class "glossary-card" featuring complex literary terms, historical figures, or high-yield words from the text defined clearly as: <div class="glossary-item"><span class="glossary-term">Term:</span> Definition goes here.</div>' : ''}
        7. ${includeQuiz ? 'Include a practice quiz section wrapped inside an HTML element with class "quiz-card". Every single practice question MUST have its direct answer fully visible and printed right beneath it using this exact structure:\n           <div class="quiz-item">\n               <div class="quiz-question">Question text here?</div>\n               <div class="quiz-answer">Answer: Detailed explanation text goes here.</div>\n          </div>' : 'Do not include a practice quiz section.'}
        8. Do not wrap the response in markdown code blocks like \`\`\`html. Output raw styled HTML directly.

        Source Material: ${text}`;

        const models = ['gemini-3.5-flash-lite', 'gemini-2.5-flash-lite', 'gemini-3.5-flash'];
        let success = false;
        let data = null;

        for (let model of models) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{text: prompt}] }]
                    })
                });

                data = await response.json();
                if (!data.error) {
                    success = true;
                    break;
                }
            } catch (e) {
                // Proceed to next fallback model
            }
        }

        genBtn.disabled = false;

        if (!success || !data || data.error) {
            const errorMsg = data && data.error ? data.error.message : "All endpoints are currently busy or rate limit reached.";
            output.innerHTML = `<span style='color: #ef4444; font-weight: bold;'>API Error: ${errorMsg}</span>`;
            return;
        }

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            let rawHtml = data.candidates[0].content.parts[0].text;
            rawHtml = rawHtml.replace(/^```(html)?[\s\S]*?\n/, '').replace(/```$/, '').trim();
            rawHtml = rawHtml.replace(/—|–|--/g, ', ');
            rawHtml = rawHtml.replace(/^[•\-\*\s•]+/, ''); // Strips rogue leading bullets/dots
            output.innerHTML = rawHtml;
        } else {
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Unexpected response structure from API.</span>";
        }
    }

    function exportToPDF() {
        const output = document.getElementById('output').innerHTML;
        if (!output || output.includes("Generated binder material will appear here") || output.includes("Error")) {
            alert("Please generate a study guide first before exporting.");
            return;
        }
        window.print();
    }
</script>
</body>
</html>
