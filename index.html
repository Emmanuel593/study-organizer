<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junior Year Note Formatter</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --hover-color: #0ea5e9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }
        h1 { font-size: 1.5rem; margin-top: 0; color: var(--accent-color); }
        label { display: block; margin: 15px 0 5px; font-weight: 600; font-size: 0.9rem; }
        select, textarea, input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea { height: 130px; resize: vertical; font-family: monospace; }
        button {
            margin-top: 20px;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--hover-color); }
        .output-section {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .output-box {
            background: #ffffff;
            color: #000000;
            padding: 20px;
            border-radius: 6px;
            min-height: 200px;
            white-space: pre-wrap;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }
        .note { font-size: 0.85rem; color: #94a3b8; margin-top: 8px; }
        .api-box { background: #0b0f19; padding: 12px; border-radius: 6px; margin-bottom: 20px; border: 1px dashed var(--border-color); }
    </style>
</head>
<body>

<div class="container">
    <h1>Junior Year Note Formatter</h1>
    <p class="note">Stateless scratchpad. Paste raw text, pick a layout, and copy straight into Google Docs. Refreshing clears everything.</p>

    <div class="api-box">
        <label for="apiKey">Gemini API Key (Saved only in your browser session):</label>
        <input type="password" id="apiKey" placeholder="Paste your AI Studio API key here...">
    </div>

    <label for="sourceType">Source Type:</label>
    <select id="sourceType">
        <option value="textbook">Textbook Chapter (Deep concepts & definitions)</option>
        <option value="article">Online Article / Essay (Key arguments & summaries)</option>
        <option value="wiki">Wikipedia / Reference (Structured timelines & facts)</option>
    </select>

    <label for="rawText">Paste Raw Text Here:</label>
    <textarea id="rawText" placeholder="Paste massive wall of text here..."></textarea>

    <label for="teacherPrompt">Teacher's Specific Focus (Optional):</label>
    <textarea id="teacherPrompt" style="height: 50px;" placeholder="e.g., Focus heavily on causes of WWI and key dates..."></textarea>

    <button onclick="formatNotes()">Generate Notes</button>

    <div class="output-section">
        <label>Formatted Output (Ready to Copy into Google Docs):</label>
        <div id="outputDisplay" class="output-box" contenteditable="true">Your formatted notes will appear here...</div>
        <p class="note">💡 Tip: You can edit the text directly in the box above before copying it to your clipboard.</p>
    </div>
</div>

<script>
    async function formatNotes() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('rawText').value.trim();
        const type = document.getElementById('sourceType').value;
        const prompt = document.getElementById('teacherPrompt').value.trim();
        const output = document.getElementById('outputDisplay');

        if (!apiKey) {
            output.innerText = "Error: Please enter your Gemini API key at the top.";
            return;
        }
        if (!text) {
            output.innerText = "Error: Please paste some text to format first.";
            return;
        }

        output.innerText = "Processing text into clean notes...";

        const systemInstruction = `You are a student note-formatting assistant. Your job is to take raw, unfiltered source text and format it into clean, highly readable human-style study notes. Avoid generic corporate AI fluff. Format it clearly with an overview, key terms featuring checkboxes like '[ ] Term:', and bullet points. Match the chosen source type style (${type}).`;
        
        let userQuery = `Format this raw text into notes.\nSource Type: ${type}\n`;
        if(prompt) userQuery += `Teacher Focus/Instructions: ${prompt}\n`;
        userQuery += `\nRaw Text:\n${text}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userQuery }] }],
                    system_instruction: { parts: [{ text: systemInstruction }] }
                })
            });

            const data = await response.json();
            
            if (data.error) {
                output.innerText = "API Error: " + data.error.message;
                return;
            }

            const rawOutput = data.candidates[0].content.parts[0].text;
            output.innerText = rawOutput;

        } catch (error) {
            output.innerText = "Network Error: Failed to generate notes. Check your API key.";
        }
    }
</script>

</body>
</html>
