<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Generator</title>
    <style>
        body { font-family: sans-serif; background: #060913; color: #f1f5f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #0d1322; padding: 30px; border-radius: 15px; border: 1px solid #1e293b; }
        label { display: block; margin: 15px 0 5px; color: #94a3b8; font-weight: bold; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; color: #f1f5f9; margin-top: 15px; }
        .checkbox-label input { width: auto; margin: 0; cursor: pointer; }
        input, textarea, select { width: 100%; padding: 12px; background: #020617; color: white; border: 1px solid #1e293b; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #3b82f6; color: white; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .copy-btn { background: #10b981; margin-top: 10px; }
        .copy-btn:hover { background: #059669; }
        #output { background: white; color: #1e293b; padding: 20px; border-radius: 8px; margin-top: 30px; line-height: 1.6; min-height: 80px; }
        .cheat-card { background: #f8fafc; border-left: 4px solid #3b82f6; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .quiz-card { background: #f1f5f9; border-left: 4px solid #10b981; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Study Generator</h1>
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your API Key">
    
    <label>Detail Depth (1: Basic, 2: Balanced, 3: Deep Dive)</label>
    <select id="depth">
        <option value="1">1 - Basic</option>
        <option value="2" selected>2 - Balanced</option>
        <option value="3">3 - Deep Dive</option>
    </select>

    <label>Vocabulary Simplification (1: Standard, 2: Simplified, 3: ELI5 / Plain English)</label>
    <select id="vocabLevel">
        <option value="1">1 - Standard</option>
        <option value="2" selected>2 - Simplified</option>
        <option value="3">3 - ELI5 (Plain English)</option>
    </select>

    <label class="checkbox-label">
        <input type="checkbox" id="includeQuiz" checked> Include Practice Quiz
    </label>

    <label>Source Text</label>
    <textarea id="rawText" rows="8" placeholder="Paste your study material here..."></textarea>

    <button onclick="generate()">Generate Content</button>
    <button class="copy-btn" onclick="copyContent()">Copy to Clipboard</button>
    
    <div id="output">Content will appear here...</div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    });

    async function generate() {
        const apiKeyInput = document.getElementById('apiKey');
        const apiKey = apiKeyInput.value.trim();
        const text = document.getElementById('rawText').value.trim();
        const depth = document.getElementById('depth').value;
        const vocabLevel = document.getElementById('vocabLevel').value;
        const includeQuiz = document.getElementById('includeQuiz').checked;
        const output = document.getElementById('output');

        if (!apiKey || !text) { 
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Missing API Key or Source Text</span>"; 
            return; 
        }

        localStorage.setItem('gemini_api_key', apiKey);
        output.innerHTML = "Generating study content... Please wait.";

        const prompt = `Act as an expert tutor. 
        Depth Level: ${depth} (1=Basic overview, 2=Balanced detail, 3=Deep exhaustive dive). 
        Vocabulary Simplification Level: ${vocabLevel} (1=Standard industry terms, 2=Simplified clear terms, 3=ELI5 plain English translation so difficult jargon is translated into terms anyone can easily understand).
        ${includeQuiz ? "Include a practice quiz section." : "Do not include a quiz."}
        
        CRITICAL FORMATTING RULES:
        1. NEVER use m-dashes (—) or double hyphens under any circumstances. Use commas, colons, periods, or parentheses instead.
        2. Return output ONLY in clean HTML format using <div class="cheat-card"> for notes and <div class="quiz-card"> for quiz items. 
        3. Do not include any internal meta-commentary, settings readouts, or text like "Depth Level" in the final output. 
        4. Do not wrap the response in markdown code blocks.
        
        Text: ${text}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    contents: [{
                        parts: [{text: prompt}]
                    }]
                })
            });

            const data = await response.json();

            if (data.error) {
                output.innerHTML = `<span style='color: #ef4444; font-weight: bold;'>API Error: ${data.error.message}</span>`;
                return;
            }

            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                let rawHtml = data.candidates[0].content.parts[0].text;
                rawHtml = rawHtml.replace(/^```(html)?[\s\S]*?\n/, '').replace(/```$/, '').trim();
                output.innerHTML = rawHtml;
            } else {
                output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Unexpected response structure from API.</span>";
            }
        } catch (e) {
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Network Error: " + e.message + "</span>";
        }
    }

    function copyContent() {
        const outputElement = document.getElementById('output');
        const textToCopy = outputElement.innerText;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = outputElement.innerHTML;
            alert("Study guide copied to clipboard!");
        }).catch(err => {
            alert("Failed to copy text: " + err);
        });
    }
</script>
</body>
</html>
