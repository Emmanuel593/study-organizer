<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A+ Study Binder Generator</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #060913; color: #f1f5f9; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: #0d1322; padding: 30px; border-radius: 15px; border: 1px solid #1e293b; box-sizing: border-box; }
        h1 { color: #3b82f6; margin-top: 0; }
        label { display: block; margin: 12px 0 5px; color: #94a3b8; font-weight: bold; font-size: 0.9rem; }
        .grid-controls { display: grid; grid-template-columns: 1fr; gap: 15px; }
        input, textarea, select { width: 100%; padding: 12px; background: #020617; color: white; border: 1px solid #1e293b; border-radius: 8px; box-sizing: border-box; }
        
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #f1f5f9; font-weight: normal; margin-top: 15px; background: #020617; padding: 12px 15px; border-radius: 8px; border: 1px solid #1e293b; }
        .checkbox-label input { width: auto; margin: 0; cursor: pointer; }

        button { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        
        /* Clean Binder-Ready Output Area */
        #output { background: #ffffff; color: #1e293b; padding: 40px; border-radius: 8px; margin-top: 25px; line-height: 1.6; min-height: 150px; border: 1px solid #cbd5e1; box-sizing: border-box; user-select: text; }
        
        /* Stacked Typography Optimized for Binder Printing and Google Docs */
        .doc-title { font-size: 22px; font-weight: bold; color: #0f172a; border-bottom: 2px solid #2563eb; padding-bottom: 8px; margin-bottom: 20px; margin-top: 0; }
        .cheat-card { background: #ffffff; color: #1e293b; border-left: 4px solid #2563eb; padding: 0 0 0 15px; margin-bottom: 25px; }
        .cheat-card h3 { margin-top: 0; margin-bottom: 8px; color: #1e293b; font-size: 16px; font-weight: bold; }
        .cheat-card p, .cheat-card ul { margin-top: 0; color: #334155; }
        
        .quiz-card { background: #ffffff; color: #1e293b; border-left: 4px solid #059669; padding: 0 0 0 15px; margin-bottom: 25px; }
        .quiz-card h3 { margin-top: 0; margin-bottom: 12px; color: #065f46; font-size: 16px; font-weight: bold; }
        .quiz-item { margin-bottom: 15px; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .quiz-question { font-weight: bold; color: #1e293b; margin-bottom: 6px; }
        .quiz-answer { color: #047857; background: #ecfdf5; padding: 8px; border-radius: 4px; border-left: 3px solid #10b981; font-weight: 500; margin-top: 4px; display: block !important; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="appTitle">A+ Binder Study Generator</h1>
    
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your API Key">
    
    <div class="grid-controls">
        <div>
            <label>Note Format Style</label>
            <select id="formatStyle">
                <option value="Clean Stacked Cornell-Style Notes" selected>Clean Stacked Notes (Topic Headings Stacked Above Explanations)</option>
            </select>
        </div>
    </div>

    <label class="checkbox-label">
        <input type="checkbox" id="includeQuiz" checked> Include Practice Quiz & Test Answers (For Binder Reference)
    </label>

    <label>Source Text / Article / Assignment Transcript</label>
    <textarea id="rawText" rows="7" placeholder="Paste messy assignment text or reading material here..."></textarea>

    <button onclick="generate()">Generate Study Guide</button>
    
    <div id="output">Generated binder material will appear here... Highlight and copy this directly into your Google Doc or print it out.</div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    });

    async function generate() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('rawText').value.trim();
        const formatStyle = document.getElementById('formatStyle').value;
        const includeQuiz = document.getElementById('includeQuiz').checked;
        const output = document.getElementById('output');

        if (!apiKey || !text) { 
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Missing API Key or Source Text</span>"; 
            return; 
        }

        localStorage.setItem('gemini_api_key', apiKey);
        output.innerHTML = "Generating top-tier binder material... Please wait.";

        const prompt = `Act as an expert academic tutor helping a student secure an A+ grade on open-note tests. 
        Note Format Style Requested: ${formatStyle}.

        CRITICAL INSTRUCTIONS:
        1. Parse the provided source text completely. Begin directly with a clear main document title wrapped inside: <h2 class="doc-title">Your Descriptive Title Here</h2>
        2. ABSOLUTE BAN: NEVER use m-dashes (—), en-dashes, or double hyphens anywhere in the response under any circumstances. Use commas, colons, semicolons, periods, or parentheses instead.
        3. Structure core notes into clean vertical blocks using the "cheat-card" class. Each block must feature a clear heading followed by clean, organized explanatory text stacked naturally underneath in simple paragraphs or bullet points. Include a comprehensive summary block at the end.
        4. ${includeQuiz ? 'Include a Practice Quiz and Test Review section wrapped inside an HTML element with class "quiz-card". Every single practice question MUST have its direct answer fully visible and printed right beneath it using this exact structure:\n           <div class="quiz-item">\n               <div class="quiz-question">Question text here?</div>\n               <div class="quiz-answer">Answer: Detailed explanation text goes here.</div>\n           </div>' : 'Do not include a practice quiz section.'}
        5. Do not wrap the response in markdown code blocks like \`\`\`html. Output raw styled HTML directly.

        Source Material: ${text}`;

        const models = ['gemini-3.5-flash-lite', 'gemini-2.5-flash-lite', 'gemini-3.5-flash'];
        let success = false;
        let data = null;

        for (let model of models) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{text: prompt}] }]
                    })
                });

                data = await response.json();
                if (!data.error) {
                    success = true;
                    break;
                }
            } catch (e) {
                // Proceed to next fallback model
            }
        }

        if (!success || !data || data.error) {
            const errorMsg = data && data.error ? data.error.message : "All endpoints are currently busy.";
            output.innerHTML = `<span style='color: #ef4444; font-weight: bold;'>API Error: ${errorMsg}</span>`;
            return;
        }

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            let rawHtml = data.candidates[0].content.parts[0].text;
            rawHtml = rawHtml.replace(/^```(html)?[\s\S]*?\n/, '').replace(/```$/, '').trim();
            rawHtml = rawHtml.replace(/—|–|--/g, ', ');
            output.innerHTML = rawHtml;
        } else {
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Unexpected response structure from API.</span>";
        }
    }
</script>
</body>
</html>
