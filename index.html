<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A+ Ultimate Cheat Sheet & Quiz Generator</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: #0d1322;
            --text-color: #f1f5f9;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #1e293b;
            --input-bg: #020617;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 { font-size: 2rem; margin: 0; color: #60a5fa; letter-spacing: -0.5px; }
        .watermark { font-size: 0.85rem; color: #64748b; font-weight: 500; }
        
        .section-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #94a3b8; }
        
        input[type="password"], textarea {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        input[type="password"]:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            outline: none;
        }
        textarea { height: 140px; resize: vertical; }
        
        .counter { font-size: 0.75rem; color: #64748b; text-align: right; margin-top: 6px; }

        button.generate-btn {
            margin-top: 15px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: background 0.2s;
        }
        button.generate-btn:hover { background: var(--accent-hover); }

        .output-section {
            margin-top: 35px;
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
        }
        
        .output-box {
            background: #ffffff;
            color: #1e293b;
            padding: 40px;
            border-radius: 10px;
            min-height: 350px;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        
        .output-box h2 { color: #1e40af; border-bottom: 2px solid #3b82f6; padding-bottom: 6px; margin-top: 30px; font-size: 1.3rem; }
        .output-box h3 { color: #0f172a; margin-top: 25px; font-size: 1.1rem; }
        .output-box .cheat-card {
            background: #f8fafc;
            border-left: 4px solid #3b82f6;
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 0 8px 8px 0;
        }
        .output-box .quiz-card {
            background: #f1f5f9;
            border-left: 4px solid #10b981;
            padding: 14px 16px;
            margin: 14px 0;
            border-radius: 0 8px 8px 0;
        }
        .output-box .highlight-term { font-weight: bold; color: #0f172a; }
        .output-box ul { margin: 8px 0; padding-left: 20px; }
        .output-box li { margin-bottom: 4px; }
        
        .api-box { background: rgba(13, 19, 34, 0.7); padding: 16px; border-radius: 10px; margin-bottom: 25px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>A+ Ultimate Cheat Sheet & Quiz Generator</h1>
        <span class="watermark">Foolproof Mode Active</span>
    </header>

    <div class="api-box">
        <label for="apiKey">Gemini API Key (Saved securely in local storage)</label>
        <input type="password" id="apiKey" placeholder="Paste your AIzaSy... key here" oninput="saveApiKey()">
        <div class="counter" style="text-align: left; margin-top: 4px;">Characters: <span id="keyCounter">0</span></div>
    </div>

    <div class="section-group">
        <label for="rawText">Paste Source Text (News Article, Textbook, Notes, Anything)</label>
        <textarea id="rawText" placeholder="Paste your messy text here..."></textarea>
        <div id="rawCounter" class="counter">Characters: 0</div>
    </div>

    <div class="section-group">
        <label for="teacherPrompt">Teacher Instructions / Test Focus (Optional)</label>
        <textarea id="teacherPrompt" style="height: 65px;" placeholder="e.g., 'Focus heavily on radiation terms and health studies...'"></textarea>
    </div>

    <button class="generate-btn" onclick="formatNotes()">Generate A+ Cheat Sheet & Practice Quiz</button>

    <div class="output-section">
        <label>Print-Ready Format (Copy and Paste straight into Google Docs)</label>
        <div id="outputDisplay" class="output-box" contenteditable="true">Your ultra-simple, perfectly unified cheat sheet and test quiz will appear here...</div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key') || '';
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            document.getElementById('keyCounter').innerText = savedKey.length;
        }
    });

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('keyCounter').innerText = key.length;
    }

    document.getElementById('rawText').addEventListener('input', (e) => {
        document.getElementById('rawCounter').innerText = `Characters: ${e.target.value.length}`;
    });

    async function formatNotes() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('rawText').value.trim();
        const prompt = document.getElementById('teacherPrompt').value.trim();
        const output = document.getElementById('outputDisplay');

        if (!apiKey) { output.innerHTML = "<p style='color:red;'>Error: Please add your API key.</p>"; return; }
        if (!text) { output.innerHTML = "<p style='color:red;'>Error: Please paste your reading text.</p>"; return; }

        output.innerHTML = "<p style='text-align:center; color:#3b82f6; font-weight:bold;'>✨ Translating jargons, building your cheat sheet, and crafting your quiz...</p>";

        const systemInstruction = `You are an elite academic engine that transforms messy, jargon-heavy source text into an absolute top-tier study package. 

CRITICAL RULES:
1. UNIFY SYNONYMS: If a text introduces overlapping terms that confuse students (like "radiofrequency radiation" and "non-ionizing radiation"), explicitly smash them together right away so the student instantly understands they mean the same safe concept.
2. PLAIN ENGLISH ONLY: No corporate jargon, no academic fluff. Explain concepts like a smart friend breaking it down.
3. STRICTLY NO EM DASHES OR SEMICOLONS: You are completely banned from using em dashes (\`—\`), en dashes (\`–\`), or semicolons. Use periods, commas, or basic sentence breaks only.
4. DUAL OUTPUT LAYOUT: Your response must contain two clear sections using pure HTML structure:
   - PART 1: A visual cheat sheet broken into clean visual blocks using:
     <h2>Section Header</h2>
     <div class="cheat-card">
       <span class="highlight-term">Bold Concept Term:</span> Direct definition and real-world translation.
     </div>
   - PART 2: A multiple-choice practice quiz containing high-yield questions matching the material, formatted using:
     <h3>Practice Quiz</h3>
     <div class="quiz-card">
       <span class="highlight-term">Question X:</span> Question text?
       <ul>
         <li>A) Option 1</li>
         <li>B) Option 2</li>
         <li>C) Option 3</li>
         <li>D) Option 4</li>
       </ul>
       <span class="highlight-term">Answer: Letter</span> (Short plain-English reason why).
     </div>
5. ZERO MARKDOWN WRAPPERS: Do not use backticks (\`\`\`html). Output raw HTML elements directly so it drops cleanly into the visual container.`;

        let userQuery = `Create an ultimate cheat sheet and practice quiz from this text.\n`;
        if(prompt) userQuery += `Teacher Focus: ${prompt}\n`;
        userQuery += `\nSource Material:\n${text}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userQuery }] }],
                    system_instruction: { parts: [{ text: systemInstruction }] }
                })
            });

            const data = await response.json();
            if (data.error) {
                output.innerHTML = `<p style='color:red;'>API Error: ${data.error.message}</p>`;
                return;
            }

            let rawOutput = data.candidates[0].content.parts[0].text;
            rawOutput = rawOutput.replace(/```[a-z]*\n?/g, '').replace(/```/g, '');

            output.innerHTML = rawOutput;

        } catch (error) {
            output.innerHTML = "<p style='color:red;'>Network error occurred. Try again.</p>";
        }
    }
</script>

</body>
</html>
