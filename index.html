<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Generator</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #060913; color: #f1f5f9; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: #0d1322; padding: 30px; border-radius: 15px; border: 1px solid #1e293b; }
        h1 { color: #3b82f6; margin-top: 0; }
        label { display: block; margin: 12px 0 5px; color: #94a3b8; font-weight: bold; font-size: 0.9rem; }
        .grid-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, textarea, select { width: 100%; padding: 12px; background: #020617; color: white; border: 1px solid #1e293b; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        
        .export-btn { background: #10b981; padding: 18px; font-size: 1.1rem; margin-top: 20px; }
        .export-btn:hover { background: #059669; }
        
        #output { background: white; color: #1e293b; padding: 25px; border-radius: 8px; margin-top: 25px; line-height: 1.6; min-height: 100px; }
        .cheat-card { background: #f8fafc; border-left: 4px solid #3b82f6; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .quiz-card { background: #f1f5f9; border-left: 4px solid #10b981; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Study Generator</h1>
    
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your API Key">
    
    <div class="grid-controls">
        <div>
            <label>Detail Depth</label>
            <select id="depth">
                <option value="1">1 - Basic</option>
                <option value="2" selected>2 - Balanced</option>
                <option value="3">3 - Deep Dive</option>
                <option value="4">4 - Deeper Than The Deep Dive</option>
            </select>
        </div>
        <div>
            <label>Vocabulary Simplification</label>
            <select id="vocabLevel">
                <option value="1">1 - Standard</option>
                <option value="2" selected>2 - Simplified</option>
                <option value="3">3 - Plain English (ELI5)</option>
            </select>
        </div>
    </div>

    <label>Note Format Style</label>
    <select id="formatStyle">
        <option value="Hierarchical Outline & Summary" selected>Hierarchical Outline & Bullet Points</option>
        <option value="Cornell Notes Format">Cornell Notes Format (Cues, Notes, Summary)</option>
        <option value="Executive Summary">Executive Summary</option>
        <option value="Q&A Format">Q&A Study Format</option>
    </select>

    <label>Source Text / Article / Transcript</label>
    <textarea id="rawText" rows="7" placeholder="Paste study text here..."></textarea>

    <button onclick="generate()">Generate Study Guide</button>
    
    <button class="export-btn" onclick="exportTextFile()">Download Text Document (.txt)</button>
    
    <div id="output">Generated study content will appear here...</div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    });

    async function generate() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('rawText').value.trim();
        const depth = document.getElementById('depth').value;
        const vocabLevel = document.getElementById('vocabLevel').value;
        const formatStyle = document.getElementById('formatStyle').value;
        const output = document.getElementById('output');

        if (!apiKey || !text) { 
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Missing API Key or Source Text</span>"; 
            return; 
        }

        localStorage.setItem('gemini_api_key', apiKey);
        output.innerHTML = "Generating study material (retrying if busy)... Please wait.";

        const prompt = `Act as an expert tutor and study assistant. 
        Format Style Requested: ${formatStyle}.
        Depth Level: ${depth} (1=Basic overview, 2=Balanced detail, 3=Deep exhaustive dive, 4=Absolute maximum deep dive). 
        Vocabulary Simplification: ${vocabLevel} (1=Standard terms, 2=Simplified terms, 3=Plain English translation).

        STRICT FORMATTING AND PUNCTUATION RULES:
        1. ABSOLUTE BAN: NEVER use m-dashes (—), en-dashes, or double hyphens anywhere in the response under any circumstances. Use commas, colons, semicolons, periods, or parentheses instead.
        2. Wrap core study notes inside <div class="cheat-card"> and include a practice quiz inside <div class="quiz-card">.
        3. Do not include internal settings tags, configuration readouts, or commentary in the final text. 
        4. Do not wrap the response in markdown code blocks like \`\`\`html. Output raw styled HTML directly.

        Source Material: ${text}`;

        // Fallback array across standard lightweight models to dodge persistent 503 capacity blocks
        const models = ['gemini-3.5-flash-lite', 'gemini-2.5-flash-lite', 'gemini-3.5-flash'];
        let success = false;
        let data = null;

        for (let model of models) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{text: prompt}] }]
                    })
                });

                data = await response.json();
                if (!data.error) {
                    success = true;
                    break;
                }
            } catch (e) {
                // Try next model if network fetch fails
            }
        }

        if (!success || !data || data.error) {
            const errorMsg = data && data.error ? data.error.message : "All fallback endpoints are currently overloaded.";
            output.innerHTML = `<span style='color: #ef4444; font-weight: bold;'>API Error: ${errorMsg}</span>`;
            return;
        }

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            let rawHtml = data.candidates[0].content.parts[0].text;
            rawHtml = rawHtml.replace(/^```(html)?[\s\S]*?\n/, '').replace(/```$/, '').trim();
            rawHtml = rawHtml.replace(/—|–|--/g, ', ');
            output.innerHTML = rawHtml;
        } else {
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Unexpected response structure from API.</span>";
        }
    }

    function exportTextFile() {
        const outputElement = document.getElementById('output');
        const textContent = outputElement.innerText;
        if (!textContent || textContent.includes("Generated study content will appear here...")) {
            alert("No content available to export!");
            return;
        }

        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'study-guide.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
