<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Generator</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #060913; color: #f1f5f9; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: #0d1322; padding: 30px; border-radius: 15px; border: 1px solid #1e293b; box-sizing: border-box; }
        h1 { color: #3b82f6; margin-top: 0; }
        label { display: block; margin: 12px 0 5px; color: #94a3b8; font-weight: bold; font-size: 0.9rem; }
        .grid-controls { display: grid; grid-template-columns: 1fr; gap: 15px; }
        input, textarea, select { width: 100%; padding: 12px; background: #020617; color: white; border: 1px solid #1e293b; border-radius: 8px; box-sizing: border-box; }
        
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #f1f5f9; font-weight: normal; margin-top: 15px; background: #020617; padding: 12px 15px; border-radius: 8px; border: 1px solid #1e293b; }
        .checkbox-label input { width: auto; margin: 0; cursor: pointer; }

        button { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .export-btn { background: #10b981; flex: 1; padding: 16px; font-size: 1.05rem; margin-top: 0; }
        .export-btn:hover { background: #059669; }
        .print-btn { background: #8b5cf6; flex: 1; padding: 16px; font-size: 1.05rem; margin-top: 0; }
        .print-btn:hover { background: #7c3aed; }
        
        #output { background: #0d1322; color: #f1f5f9; padding: 30px; border-radius: 8px; margin-top: 25px; line-height: 1.6; min-height: 100px; border: 1px solid #1e293b; box-sizing: border-box; }
        
        /* Document Layout inside Output */
        .doc-title { font-size: 1.8rem; font-weight: bold; color: #f1f5f9; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; margin-bottom: 20px; margin-top: 0; page-break-after: avoid; break-after: avoid; }
        .cheat-card { background: #f8fafc; color: #1e293b; border-left: 4px solid #3b82f6; padding: 20px; margin-bottom: 20px; border-radius: 6px; box-sizing: border-box; page-break-inside: avoid; break-inside: avoid; }
        .cheat-card h2, .cheat-card h3 { margin-top: 0; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; page-break-after: avoid; break-after: avoid; }
        
        .quiz-card { background: #f1f5f9; color: #1e293b; border-left: 4px solid #10b981; padding: 20px; margin-bottom: 20px; border-radius: 6px; box-sizing: border-box; page-break-inside: avoid; break-inside: avoid; }
        .quiz-card h2, .quiz-card h3 { margin-top: 0; color: #065f46; border-bottom: 1px solid #cbd5e1; padding-bottom: 6px; page-break-after: avoid; break-after: avoid; }
        .quiz-item { margin-bottom: 15px; background: #ffffff; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; page-break-inside: avoid; break-inside: avoid; }
        .quiz-question { font-weight: bold; color: #1e293b; margin-bottom: 8px; }
        .quiz-answer { color: #047857; background: #ecfdf5; padding: 10px; border-radius: 4px; border-left: 3px solid #10b981; font-weight: 500; margin-top: 5px; }

        /* Print Layout: Locks white background strictly to printed paper, forces title & headers to stay locked with content */
        @media print {
            body { background: #ffffff !important; color: #000000 !important; padding: 0 !important; }
            .container { max-width: 100% !important; background: #ffffff !important; border: none !important; padding: 0 !important; box-shadow: none !important; }
            h1, label, input, textarea, select, button, .btn-row, .grid-controls, .checkbox-label { display: none !important; }
            #output { background: #ffffff !important; color: #000000 !important; border: none !important; margin-top: 0 !important; padding: 0 !important; box-shadow: none !important; }
            .doc-title { color: #000000 !important; border-bottom: 2px solid #000000 !important; page-break-after: avoid !important; break-after: avoid !important; }
            .cheat-card, .quiz-card { border: 1px solid #cbd5e1 !important; page-break-inside: avoid !important; break-inside: avoid !important; background: #ffffff !important; color: #000000 !important; margin-bottom: 20px !important; box-shadow: none !important; }
            .cheat-card h2, .cheat-card h3, .quiz-card h2, .quiz-card h3 { page-break-after: avoid !important; break-after: avoid !important; }
            .quiz-item { background: #ffffff !important; border: 1px solid #cbd5e1 !important; }
            .quiz-answer { background: #f8fafc !important; color: #000000 !important; border-left: 3px solid #64748b !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 id="appTitle">Study Generator</h1>
    
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your API Key">
    
    <div class="grid-controls">
        <div>
            <label>Note Format Style</label>
            <select id="formatStyle">
                <option value="Cornell Notes Format" selected>Cornell Notes Format (Structured Cues, Notes, and Summary)</option>
                <option value="Standard Clean Notes & Q&A">Standard Clean Notes & Direct Q&A Pairs</option>
            </select>
        </div>
    </div>

    <label class="checkbox-label">
        <input type="checkbox" id="includeQuiz" checked> Include Practice Quiz (With Direct Answers Provided)
    </label>

    <label>Source Text / Article / Transcript</label>
    <textarea id="rawText" rows="7" placeholder="Paste study text here..."></textarea>

    <button onclick="generate()">Generate Study Guide</button>
    
    <div class="btn-row">
        <button class="export-btn" onclick="exportTextFile()">Download Text Document (.txt)</button>
        <button class="print-btn" onclick="triggerPrint()">Print Study Guide</button>
    </div>
    
    <div id="output">Generated study content will appear here...</div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    });

    async function generate() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('rawText').value.trim();
        const formatStyle = document.getElementById('formatStyle').value;
        const includeQuiz = document.getElementById('includeQuiz').checked;
        const output = document.getElementById('output');

        if (!apiKey || !text) { 
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Missing API Key or Source Text</span>"; 
            return; 
        }

        localStorage.setItem('gemini_api_key', apiKey);
        output.innerHTML = "Generating study material (retrying automatically if busy)... Please wait.";

        const prompt = `Act as an expert tutor and study assistant. 
        Note Format Style Requested: ${formatStyle}.

        CRITICAL STRUCTURAL INSTRUCTIONS:
        1. Start your response with a clear main document title wrapped inside: <h2 class="doc-title">Your Descriptive Title Here</h2>
        2. ABSOLUTE BAN: NEVER use m-dashes (—), en-dashes, or double hyphens anywhere in the response under any circumstances. Use commas, colons, semicolons, periods, or parentheses instead.
        3. Wrap core study notes inside clean HTML elements with class "cheat-card". IMPORTANT: Do not just list standalone heading bullet points. Every core concept must be framed as a clear explanatory section where key questions are directly addressed with full text answers. Keep the summary section locked at the bottom of the notes.
        4. ${includeQuiz ? 'Include a Practice Quiz section wrapped inside an HTML element with class "quiz-card". Every single quiz question MUST have its direct answer fully written out and printed right beneath it using this exact structure:\n           <div class="quiz-item">\n               <div class="quiz-question">Question text here?</div>\n               <div class="quiz-answer">Answer: Detailed explanation text goes here.</div>\n           </div>' : 'Do not include a practice quiz section.'}
        5. Do not wrap the response in markdown code blocks like \`\`\`html. Output raw styled HTML directly.

        Source Material: ${text}`;

        const models = ['gemini-3.5-flash-lite', 'gemini-2.5-flash-lite', 'gemini-3.5-flash'];
        let success = false;
        let data = null;

        for (let model of models) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{text: prompt}] }]
                    })
                });

                data = await response.json();
                if (!data.error) {
                    success = true;
                    break;
                }
            } catch (e) {
                // Proceed to next fallback model
            }
        }

        if (!success || !data || data.error) {
            const errorMsg = data && data.error ? data.error.message : "All endpoints are currently busy.";
            output.innerHTML = `<span style='color: #ef4444; font-weight: bold;'>API Error: ${errorMsg}</span>`;
            return;
        }

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            let rawHtml = data.candidates[0].content.parts[0].text;
            rawHtml = rawHtml.replace(/^```(html)?[\s\S]*?\n/, '').replace(/```$/, '').trim();
            rawHtml = rawHtml.replace(/—|–|--/g, ', ');
            output.innerHTML = rawHtml;
        } else {
            output.innerHTML = "<span style='color: #ef4444; font-weight: bold;'>Error: Unexpected response structure from API.</span>";
        }
    }

    function exportTextFile() {
        const outputElement = document.getElementById('output');
        const textContent = outputElement.innerText;
        if (!textContent || textContent.includes("Generated study content will appear here...")) {
            alert("No content available to export!");
            return;
        }

        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'study-guide.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function triggerPrint() {
        const outputElement = document.getElementById('output');
        if (!outputElement.innerText || outputElement.innerText.includes("Generated study content will appear here...")) {
            alert("No content available to print!");
            return;
        }
        window.print();
    }
</script>
</body>
</html>
